name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deuce
          POSTGRES_PASSWORD: deuce
          POSTGRES_DB: deuce_test
        ports: ['5434:5432']
        options: >-
          --health-cmd 'pg_isready -U deuce -d deuce_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://deuce:deuce@localhost:5434/deuce_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deuce/server exec prisma generate
      - run: pnpm --filter @deuce/server db:migrate:test
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .
